<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Javascript Basic</title>
  </head>
  <body>
    <h2>Chương trình bật / tắt bóng đèn</h2>
    <img src="./img/bulboff.gif" id="bulb" alt="light" width="120px" />
    <br />
    <button onclick="toggleLight()">On / Off</button>

    <script>
      function toggleLight() {
        let bulb = document.getElementById("bulb");
        if (bulb.src.includes("bulboff.gif")) {
          bulb.src = "./img/bulbon.gif";
        } else {
          bulb.src = "./img/bulboff.gif";
        }
      }
    </script>
  </body>
</html>
