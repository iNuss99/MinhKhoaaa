<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kiểm tra số chẵn - số lẻ</title>
  </head>

  <body>
    <h2>Kiểm tra số chẵn - số lẻ</h2>
    <label for="number">Nhập số:</label>
    <input type="number" id="number" />
    <br />
    <button onclick="checkNumber()">Check</button>
    <p id="result"></p>

    <script>
      function checkNumber() {
        let number = document.getElementById("number").value;
        if (number % 2 === 0) {
          document.getElementById("result").innerHTML = number + " là số chẵn";
        } else {
          document.getElementById("result").innerHTML = number + " là số lẻ";
        }
      }
    </script>
  </body>
</html>
