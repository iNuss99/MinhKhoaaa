<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CHương trình tính tuổi</title>
  </head>
  <body>
    <h2>chuong trinh tinh tuoi</h2>
    <label for="age">Your of Birth</label>
    <input type="number" id="year" />
    <br />
    <button onclick="calculateAge()">Caculate</button>
    <p id="result"></p>

    <script>
      function calculateAge() {
        let birthday = document.getElementById("year").value;
        let currentYear = new Date().getFullYear();
        let age = currentYear - birthday;
        document.getElementById("result").innerHTML = "Your age is: " + age;
      }
    </script>
  </body>
</html>
