<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Đổi màu nền</title>
  </head>
  <body>
    <h2>Đổi màu nền</h2>

    <button onclick="doiMau('red')">Đỏ</button>
    <button onclick="doiMau('blue')">Xanh</button>
    <button onclick="doiMau('yellow')">Vàng</button>

    <script>
      function doiMau(color) {
        document.body.style.backgroundColor = color;
      }
    </script>
  </body>
</html>
