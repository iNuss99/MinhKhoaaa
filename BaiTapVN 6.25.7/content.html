<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tour</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="content-container">
      <h2>Các Tour du lịch</h2>
      <div class="card-gril">
        <div class="card">
          <img
            src="https://cdn3.ivivu.com/2025/02/phu-quoc-ivivu1.jpg"
            alt="Phú Quốc"
          />
          <h3>Tour Phú Quốc</h3>
          <p>Phú Quốc là nơi có vùng biển đẹp nhất</p>
          <p class="price">15.000.000 VNĐ</p>
        </div>
        <div class="card">
          <img src="./img/dalat.jpg" alt="Đà Lạt" />
          <h3>Tour Đà Lạt</h3>
          <p>Đà Lạt là nơi chill nhất</p>
          <p class="price">10.000.000 VNĐ</p>
        </div>
        <div class="card">
          <img
            src="./img/things-to-do-in-ha-long-bay-banner-1-1920x1080.jpg"
            alt="Hạ Long"
          />
          <h3>Tour Vịnh Hạ Long</h3>
          <p>
            Vịnh Hạ Long là nơi được Unesco công nhận, là kỳ quan của thới giới
          </p>
          <p class="price">30.000.000 VNĐ</p>
        </div>
      </div>
    </section>
  </body>
</html>
